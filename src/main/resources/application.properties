spring.application.name=IdeaMiner

# SQLite Database for Structured Metadata
spring.datasource.url=jdbc:sqlite:ideaminer_metadata.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect

# Turn off banner for CLI tool
spring.main.banner-mode=off

# Langchain4j OpenAI config (expects OPENAI_API_KEY env var)
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo}
langchain4j.open-ai.chat-model.model-name=gpt-4o
