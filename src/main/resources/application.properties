spring.application.name=IdeaMiner

# PostgreSQL database for code intelligence metadata and pgvector embeddings.
spring.datasource.url=${IDEAMINER_DB_URL:jdbc:postgresql://localhost:5432/ideaminer}
spring.datasource.username=${IDEAMINER_DB_USERNAME:ideaminer}
spring.datasource.password=${IDEAMINER_DB_PASSWORD:ideaminer}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema creation and migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Deterministic source-file scanning. Start with production Java only.
ideaminer.scan.include-extensions=.java
ideaminer.scan.exclude-segments=.git,.gradle,.idea,.ideaminer,build,target,out,generated,generated-sources,__tests__,test,tests

# Turn off banner for CLI tool
spring.main.banner-mode=off

# Langchain4j OpenAI config (expects OPENAI_API_KEY env var)
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo}
langchain4j.open-ai.chat-model.model-name=gpt-4o
