<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workspaces</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
<a href="/" class="btn btn-outline-secondary btn-sm mb-3">Home</a>
<h2>Workspace Management</h2>
<form method="post" action="/workspace/create" class="row g-2 mb-3">
    <div class="col-md-5">
        <input type="text" name="name" class="form-control" placeholder="workspace name">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary">Create Workspace</button>
    </div>
</form>
<h3>Existing Workspaces</h3>
<div class="card">
    <ul class="list-group list-group-flush">
        <li class="list-group-item" th:each="w : ${workspaces}">
            <a th:href="@{/workspace(name=${w.name})}" th:text="${w.name}">workspace</a>
            <span class="text-secondary" th:text="' (repos=' + ${w.repo_count} + ')'"></span>
        </li>
    </ul>
</div>
</div>
</body>
</html>
