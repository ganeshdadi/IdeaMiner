<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IdeaMiner Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">IdeaMiner Dashboard</h2>
        <a href="/workspace" class="btn btn-outline-secondary btn-sm">Manage Workspaces</a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <p class="mb-2 text-secondary">Onboard runs the full indexing pipeline for a repository.</p>
            <form id="onboardForm" class="row g-2">
                <div class="col-md-8">
                    <input class="form-control" type="text" name="repoPath" placeholder="/path/to/repo">
                </div>
                <div class="col-auto">
                    <button type="button" id="browseBtn" class="btn btn-outline-primary">Browse</button>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Onboard</button>
                </div>
            </form>
            <pre id="runStatus" class="bg-body-tertiary border rounded p-2 mt-3 mb-0"></pre>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Repositories</div>
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead><tr><th>Name</th><th>ID</th><th>Path</th><th>Actions</th></tr></thead>
    <tbody>
    <tr th:each="repo : ${repos}">
        <td th:text="${repo.name()}">name</td>
        <td th:text="${repo.id()}">id</td>
        <td th:text="${repo.localPath()}">path</td>
        <td>
            <button type="button" class="reindexBtn btn btn-sm btn-outline-primary" th:attr="data-repo=${repo.id()}">Reindex</button>
            <a th:href="@{/repo(repo=${repo.id()})}" class="btn btn-sm btn-secondary">View</a>
        </td>
    </tr>
    </tbody>
            </table>
        </div>
    </div>
</div>
<script>
const form = document.getElementById('onboardForm');
const runStatus = document.getElementById('runStatus');
const browseBtn = document.getElementById('browseBtn');

browseBtn.addEventListener('click', async () => {
  runStatus.textContent = 'Opening folder picker...';
  const response = await fetch('/browse-repo', { method: 'POST' });
  const payload = await response.json();
  if (payload.path) {
    form.repoPath.value = payload.path;
    runStatus.textContent = 'Selected: ' + payload.path;
  } else {
    runStatus.textContent = payload.error || 'No folder selected.';
  }
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const repoPath = form.repoPath.value;
  if (!repoPath) return;
  runStatus.textContent = 'Starting onboarding...';
  const body = new URLSearchParams({ repoPath });
  const response = await fetch('/onboard', { method: 'POST', body });
  const payload = await response.json();
  runStatus.textContent = 'Run: ' + payload.runId;
  poll(payload.runId, repoPath);
});

async function poll(runId, repoPath) {
  const timer = setInterval(async () => {
    const response = await fetch('/onboard/status?runId=' + encodeURIComponent(runId));
    const state = await response.json();
    runStatus.textContent = JSON.stringify(state, null, 2);
    if (state.status === 'completed' || state.status === 'failed') {
      clearInterval(timer);
      window.location.href = '/repo?repo=' + encodeURIComponent(repoPath);
    }
  }, 1500);
}

document.querySelectorAll('.reindexBtn').forEach((button) => {
  button.addEventListener('click', async () => {
    const repoPath = button.getAttribute('data-repo');
    runStatus.textContent = 'Starting reindex...';
    const body = new URLSearchParams({ repoPath });
    const response = await fetch('/onboard', { method: 'POST', body });
    const payload = await response.json();
    runStatus.textContent = 'Run: ' + payload.runId;
    poll(payload.runId, repoPath);
  });
});
</script>
</body>
</html>
