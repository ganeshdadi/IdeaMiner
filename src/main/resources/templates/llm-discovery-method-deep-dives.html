<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Method Deep Dives</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex gap-2 mb-3">
        <a href="/" class="btn btn-outline-secondary btn-sm">Home</a>
    </div>
    <h2 class="mb-2">LLM Method Deep Dives</h2>
    <p class="text-secondary mb-3" th:text="'Run: ' + ${runId}"></p>
    <pre class="bg-body-tertiary border rounded p-2" th:text="${runStatus}">status</pre>
    <div class="card mt-3">
        <div class="card-header">Deep Dives</div>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm mb-0">
                <thead>
                <tr>
                    <th>Repository</th>
                    <th>Class</th>
                    <th>Method</th>
                    <th>Trigger</th>
                    <th>Status</th>
                    <th>Summary JSON</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${deepDives}">
                    <td th:text="${row.get('repository_name')}">repo</td>
                    <td th:text="${row.get('class_name')}">class</td>
                    <td th:text="${row.get('method_name')}">method</td>
                    <td th:text="${row.get('trigger_reason')}">trigger</td>
                    <td th:text="${row.get('status')}">status</td>
                    <td><pre class="mb-0" th:text="${row.get('summary_json')}">json</pre></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
