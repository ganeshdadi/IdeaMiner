<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workspace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
<div class="mb-3 d-flex gap-2">
    <a href="/" class="btn btn-outline-secondary btn-sm">Home</a>
    <a href="/workspace" class="btn btn-outline-secondary btn-sm">All Workspaces</a>
</div>
<h2 th:text="'Workspace: ' + ${name}">Workspace</h2>
<div class="card mb-3">
    <div class="card-header">Add Repository</div>
    <div class="card-body">
        <form method="post" action="/workspace/add" class="row g-2">
        <input type="hidden" name="name" th:value="${name}">
        <div class="col-md-8">
            <select name="repo" class="form-select">
            <option th:each="repo : ${repos}" th:value="${repo.id()}" th:text="${repo.name() + ' | ' + repo.id()}">repo</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Add Repository</button>
        </div>
    </form>
    </div>
</div>
<h3>Repositories in Workspace</h3>
<div class="card mb-3">
    <ul class="list-group list-group-flush">
    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="r : ${workspaceRepos}">
        <span th:text="${r.name} + ' | ' + ${r.id} + ' | ' + ${r.local_path}">repo</span>
        <form method="post" action="/workspace/remove" class="m-0">
            <input type="hidden" name="name" th:value="${name}">
            <input type="hidden" name="repo" th:value="${r.id}">
            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
        </form>
    </li>
    </ul>
</div>
<h3>Candidates</h3>
<div class="card mb-3">
    <div class="card-body">
        <ul class="mb-0">
            <li th:each="c : ${candidates}" th:text="${c}">candidate</li>
        </ul>
    </div>
</div>
<h3>Known Workspaces</h3>
<ul class="list-group mb-3">
    <li class="list-group-item" th:each="w : ${workspaces}">
        <a th:href="@{/workspace(name=${w.name})}" th:text="${w.name}">workspace</a>
        <span class="text-secondary" th:text="' (repos=' + ${w.repo_count} + ')'"></span>
    </li>
</ul>
<div class="card border-danger">
    <div class="card-header text-danger">Delete Workspace</div>
    <div class="card-body">
    <form method="post" action="/workspace/delete">
        <input type="hidden" name="name" th:value="${name}">
        <div class="row g-2">
            <div class="col-md-6">
                <input type="text" name="confirm" class="form-control" placeholder="Type workspace name to confirm">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-danger">Delete Workspace</button>
            </div>
        </div>
    </form>
    </div>
</div>
</div>
</body>
</html>
