plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.ideaminer'
version = '0.0.1-SNAPSHOT'
description = 'AI Opportunity Discovery Tool'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    langchain4jVersion = '0.30.0'
    javaparserVersion = '3.25.9'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation "com.github.javaparser:javaparser-symbol-solver-core:${javaparserVersion}"
    implementation "dev.langchain4j:langchain4j:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-easy-rag:${langchain4jVersion}"
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
